name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: 'Linux (.deb & .AppImage)'
            build_cmd: 'npm run build:linux'
          - os: windows-latest
            artifact_name: 'Windows (.exe)'
            build_cmd: 'npm run build:win'
          - os: macos-latest
            artifact_name: 'macOS (.dmg)'
            build_cmd: 'npm run build:mac'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Compile Desktop Package
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

  create-github-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Bundle
        run: |
          npm ci || npm install
          npm run build
          cd dist && zip -r ../finoras-store-web.zip . && cd ..

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          path: all-releases
        continue-on-error: true

      - name: Move all release files
        run: |
          mkdir -p release-assets
          cp finoras-store-web.zip release-assets/
          if [ -d "all-releases" ]; then
            find all-releases -type f -exec cp {} release-assets/ \;
          fi
          ls -la release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "Finora's Store ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## 🐺 Finora's Store — Official Release
            
            Multi-platform Open Source Application Store powered by GitHub Releases.
            
            ### 📥 Desteklenen Platform Paketleri:
            - **Windows**: `.exe` Installer & Portable `.zip`
            - **Linux (Debian / Ubuntu / Mint)**: `.deb` paketi
            - **Linux (Evrensel)**: `.AppImage`
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Web & PWA**: Android ve iOS için tarayıcıdan doğrudan kullanılabilir veya ana ekrana eklenebilir.
            
            ---
            *Finora's Store - GitHub Actions ile otomatik derlenmiştir.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
