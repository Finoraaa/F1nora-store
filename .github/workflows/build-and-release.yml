name: Build & Release Multi-Platform Apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (Örn: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Compile Desktop App
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx --yes electron-builder --mac -c.mac.identity=null
          elif [ "${{ matrix.platform }}" = "win" ]; then
            npx --yes electron-builder --win
          else
            npx --yes electron-builder --linux
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finoras-store-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web & Sync Android Assets
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          npx --yes @capacitor/cli sync android || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/FinorasStore-Android.apk
          ls -lh dist-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finoras-store-android
          path: dist-apk/FinorasStore-Android.apk
          if-no-files-found: error

  release:
    name: Publish Multi-Platform Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-all
          merge-multiple: true

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release-final
          # Filter out blockmaps and internal yaml files
          find release-all -type f ! -name "*.blockmap" ! -name "*.yml" ! -name "*.yaml" -exec cp {} release-final/ \;
          ls -la release-final/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "Finora's Store ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}"
          draft: false
          prerelease: false
          files: release-final/*
          body: |
            ## 🐺 Finora's Store — Çok Platformlu Uygulama Paketleri

            Tüm sistemler için resmi Finora's Store uygulaması derlendi:

            - 🤖 **Android**: `FinorasStore-Android.apk` (Doğrudan cihaza indirip kurabilirsiniz)
            - 🪟 **Windows**: `.exe` (NSIS Yükleyici) ve Taşınabilir `.zip`
            - 🐧 **Linux (Debian / Ubuntu / Mint)**: `.deb` paketi
            - 🐧 **Linux (Evrensel)**: `.AppImage` (Herhangi bir Linux dağıtımında çift tıkla çalışır)
            - 🍎 **macOS**: `.dmg` (Apple Silicon & Intel) ve `.zip`

            ---
            *GitHub Actions CI/CD ile otomatik derlenmiştir.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
